apiVersion: apps/v1
kind: Deployment
metadata:
  name: autotrack-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autotrack-backend
  template:
    metadata:
      labels:
        app: autotrack-backend
    spec:
      containers:
      - name: backend
        image: autotrack-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: DEBUG
          value: "True"
        - name: DB_NAME
          value: autotrack_db
        - name: DB_USER
          value: root
        - name: DB_PASSWORD
          value: rootpassword
        - name: DB_HOST
          value: db
        - name: DB_PORT
          value: "3306"
---
apiVersion: v1
kind: Service
metadata:
  name: autotrack-backend-service
spec:
  type: NodePort
  selector:
    app: autotrack-backend
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30090